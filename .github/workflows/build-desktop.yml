name: Build Linux desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sweider72/kasm-linux-desktop
  IMAGE_TAG: kasm-1.18.0

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          bash -n scripts/install-desktop.sh scripts/custom_startup.sh
          shellcheck scripts/install-desktop.sh scripts/custom_startup.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: workspace-check:local
      - name: Verify installed apps and Kasm permissions
        run: |
          test "$(docker inspect --format '{{.Config.User}}' workspace-check:local)" = "1000"
          docker run --rm --entrypoint /bin/bash workspace-check:local -euc '
            test "$(id -u)" = "1000"
            test "$HOME" = "/home/kasm-user"
            test -w "$HOME"
            test -x /dockerstartup/custom_startup.sh
            test -x /dockerstartup/set_user_permission.sh
            for app in thunderbird nextcloud firefox google-chrome tabby chatgpt claude-desktop libreoffice; do command -v "$app"; done
            thunderbird_version="$(dpkg-query -W -f='\''${Version}'\'' thunderbird)"
            dpkg --compare-versions "${thunderbird_version#*:}" ge 157.0.1~
            test "$(dpkg-query -W -f='\''${Status}'\'' thunderbird-l10n-de)" = "install ok installed"
            thunderbird --version
            cat /etc/workspace-app-versions.txt
            test -x /home/kasm-default-profile/Desktop/thunderbird.desktop
            test -x /home/kasm-default-profile/Desktop/nextcloud.desktop
            test -x /home/kasm-default-profile/Desktop/google-chrome.desktop
            for app in tabby chatgpt claude-desktop; do
              test -x "/home/kasm-default-profile/Desktop/kasm-$app.desktop"
            done
            locale -a | grep -qi "de_DE.utf8"
          '
      - name: Record image versions
        run: |
          echo '### Installed application versions' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint cat workspace-check:local /etc/workspace-app-versions.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify desktop application startup
        run: |
          docker run -d --name desktop-smoke --shm-size=512m -e VNC_PW=ci-smoke-only workspace-check:local
          trap 'docker logs desktop-smoke; docker exec desktop-smoke bash -c "ps -ef; cat /tmp/*startup*.log /tmp/*thunderbird*.log 2>/dev/null || true"; docker rm -f desktop-smoke' EXIT
          for attempt in $(seq 1 60); do
            if docker exec desktop-smoke bash -c 'pgrep -x thunderbird && pgrep -x nextcloud'; then
              docker exec desktop-smoke bash -euc '
                timeout 30 google-chrome --headless --disable-gpu --dump-dom about:blank > /tmp/chrome-smoke.html
                grep -q "<html" /tmp/chrome-smoke.html
              '
              exit 0
            fi
            sleep 2
          done
          echo 'Desktop applications did not start within 120 seconds' >&2
          exit 1
      - name: Verify LibreOffice document conversion
        run: |
          docker run --rm --entrypoint bash workspace-check:local -euc '
            printf "LibreOffice Test\n" > /tmp/office-smoke.txt
            timeout 45 libreoffice -env:UserInstallation=file:///tmp/office-smoke-profile --headless --convert-to pdf --outdir /tmp /tmp/office-smoke.txt
            test -s /tmp/office-smoke.pdf
          '
      - name: Verify Tabby and AI desktop windows
        run: |
          docker run -d --name extra-app-smoke --shm-size=512m -e VNC_PW=ci-smoke-only workspace-check:local
          trap 'docker logs --tail 100 extra-app-smoke; docker rm -f extra-app-smoke' EXIT
          docker exec extra-app-smoke timeout 120 /usr/bin/desktop_ready
          for app in tabby chatgpt claude-desktop; do
            docker exec -e SMOKE_APP="$app" extra-app-smoke bash -euc '
              "$SMOKE_APP" > "/tmp/$SMOKE_APP-smoke.log" 2>&1 &
              app_pid=$!
              trap '\''cat "/tmp/$SMOKE_APP-smoke.log"; kill "$app_pid" 2>/dev/null || true'\'' EXIT
              echo "Checking visible window for $SMOKE_APP (PID $app_pid)"
              window_found=false
              for attempt in $(seq 1 60); do
                kill -0 "$app_pid"
                for window in $(xdotool search --onlyvisible --name "." 2>/dev/null || true); do
                  candidate=$(xdotool getwindowpid "$window" 2>/dev/null) || continue
                  while test "$candidate" -gt 1 && test -r "/proc/$candidate/status"; do
                    if test "$candidate" = "$app_pid"; then
                      echo "Visible app window $window (process family $app_pid)"
                      window_found=true
                      break
                    fi
                    candidate=$(awk "/^PPid:/ {print \$2}" "/proc/$candidate/status")
                  done
                  if test "$window_found" = true; then break; fi
                done
                if test "$window_found" = true; then break; fi
                sleep 1
              done
              test "$window_found" = true
              sleep 5
              kill -0 "$app_pid"
            '
          done
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag workspace-check:local "$IMAGE:$IMAGE_TAG"
          docker tag workspace-check:local "$IMAGE:$IMAGE_TAG-run-${{ github.run_id }}-${{ github.run_attempt }}"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:$IMAGE_TAG-run-${{ github.run_id }}-${{ github.run_attempt }}"
